 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hepozy — Create account</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1a1a; --surface: #242424; --input-bg: #2e2e2e;
      --input-f: #363636; --orange: #e8600a; --orange-h: #d05508;
      --text: #efefef; --muted: #777; --muted2: #444; --error: #e05555; --radius: 9px;
    }
    body {
      min-height: 100vh; background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Sora', sans-serif; color: var(--text); padding: 32px 20px;
    }
    .card { width: 100%; max-width: 400px; background: var(--bg); border-radius: 16px; padding: 40px 36px 32px; }
    .card-logo {
      width: 40px; height: 40px; background: var(--orange); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 22px;
    }
    .card h1  { font-size: 21px; font-weight: 600; margin-bottom: 5px; letter-spacing: -0.3px; }
    .card .sub{ font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    .error-msg {
      display: none; background: rgba(224,85,85,0.1); color: var(--error);
      font-size: 12.5px; padding: 9px 12px; border-radius: var(--radius); margin-bottom: 16px;
    }
    .error-msg.show { display: block; }
    .field { margin-bottom: 16px; }
    label {
      display: block; font-size: 11.5px; font-weight: 500; color: var(--muted);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    input {
      width: 100%; background: var(--input-bg); border: none; outline: none;
      border-radius: var(--radius); padding: 11px 13px; font-size: 13.5px;
      font-family: 'Sora', sans-serif; color: var(--text); transition: background 0.14s;
    }
    input:focus       { background: var(--input-f); }
    input::placeholder{ color: var(--muted2); }
    .btn {
      width: 100%; padding: 12px; background: var(--orange); color: #fff; border: none;
      border-radius: var(--radius); font-size: 13.5px; font-weight: 600;
      font-family: 'Sora', sans-serif; cursor: pointer; margin-top: 6px;
      transition: background 0.14s; display: flex; align-items: center;
      justify-content: center; gap: 8px; min-height: 44px;
    }
    .btn:hover    { background: var(--orange-h); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-link { margin-top: 20px; font-size: 12.5px; color: var(--muted); text-align: center; }
    .footer-link a { color: var(--orange); text-decoration: none; font-weight: 500; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-logo">H</div>
    <h1>Create account</h1>
    <p class="sub">Sign up to get started.</p>
    <div class="error-msg" id="errorMsg"></div>

    <form id="form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
      </div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="Choose a username" required autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create a password" required autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="confirm" placeholder="Repeat your password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn" id="btn">
        <span id="btnText">Create account</span>
        <span class="spinner" id="spinner"></span>
      </button>
    </form>

    <div class="footer-link">Already have an account? <a href="login.html">Log in</a></div>
  </div>

  <script>
    const API = 'http://localhost:8001';

    if (localStorage.getItem('hepozy_token')) window.location.href = 'home.html';

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();

      const errorMsg = document.getElementById('errorMsg');
      const btn      = document.getElementById('btn');
      const btnText  = document.getElementById('btnText');
      const spinner  = document.getElementById('spinner');

      errorMsg.classList.remove('show');
      btn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'inline-block';

      const email    = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;

      const reset = () => {
        btn.disabled = false;
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
      };

      if (password.length < 8) {
        errorMsg.textContent = 'Password must be at least 8 characters.';
        errorMsg.classList.add('show');
        reset(); return;
      }
      if (password !== confirm) {
        errorMsg.textContent = 'Passwords do not match.';
        errorMsg.classList.add('show');
        reset(); return;
      }

      try {
        // ✅ correct route: /auth/reg  (was /auth/signup — that route does not exist)
        const res  = await fetch(`${API}/auth/signup`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, username, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.detail || 'Sign up failed.';
          errorMsg.classList.add('show');
          reset(); return;
        }

        localStorage.setItem('hepozy_token',    data.token);
        localStorage.setItem('hepozy_username', data.username);
        window.location.href = 'home.html';

      } catch {
        errorMsg.textContent = 'Unable to connect to server.';
        errorMsg.classList.add('show');
        reset();
      }
    });
  </script>
</body>
</html>
